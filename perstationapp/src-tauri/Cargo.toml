[package]
name = "esp32wiegandrfidreader"
version = "0.1.0"
description = "Race runner tracking: ESP32 + UHF RFID -> WiFi -> SQLite"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.7"
tokio = { version = "1", features = ["net", "rt", "sync"] }
mdns-sd = "0.11"
local-ip-address = "0.6"
tauri-plugin-dialog = "2"
ureq = { version = "2", default-features = false, features = ["json", "tls"] } # http and https (rustls) to the central app

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
